          in an animal's life.
        </p>

        <p>
          PawConnect is a free pet platform built for Sri Lanka. Whether you
          want to adopt a dog or cat, find a lost pet, report a stray animal,
          or find a forever home for a rescued pet, PawConnect LK connects
          compassionate people across the island, from Colombo to Galle and
          Kandy to Jaffna.
        </p>

          </li>

            Dogs and puppies for adoption
          </li>
          <li>
            <a href="https://pawconnect.lk/adopt/cats">Adopt a Cat</a> —
            Cats and kittens for adoption
          </li>
          <li>

          </li>
          <li>

          </li>
          <li>
            <a href="https://pawconnect.lk/dashboard">Impact Dashboard</a> —

          </li>
          <li>

          </li>
          <li>

            Reach out for questions or support
